AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Underpass Sentinel - dashboard, API, agent and persistence
Parameters:
  FrontendOrigins:
    Type: CommaDelimitedList
    Default: https://example.amplifyapp.com
    Description: Extra browser origins allowed to call this API. Not needed when the dashboard is opened from the API URL itself.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  BedrockRegion:
    Type: String
    Default: us-east-1
Globals:
  Function:
    Runtime: python3.13
    Timeout: 29
    MemorySize: 2048
Resources:
  SentinelApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref FrontendOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600
  ProposalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  ThresholdsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: spot_id, AttributeType: S}]
      KeySchema: [{AttributeName: spot_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Underpass Sentinel dispatcher alerts
  SentinelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda-build/
      Handler: backend.app.main.handler
      Environment:
        Variables:
          USE_DYNAMODB: 'true'
          AGENT_PROVIDER: bedrock
          # Below API Gateway's 30 second limit, so a slow model falls back to template text instead of an error.
          AGENT_TIMEOUT_SECONDS: '12'
          OPENMETEO_TIMEOUT_SECONDS: '8'
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DYNAMODB_PROPOSALS_TABLE: !Ref ProposalsTable
          DYNAMODB_THRESHOLDS_TABLE: !Ref ThresholdsTable
          DYNAMODB_HISTORY_TABLE: !Ref HistoryTable
          SNS_TOPIC_ARN: !Ref AlertTopic
          LOCAL_DATA_DIR: /tmp/underpass-sentinel
          CORS_ORIGINS: !Join [",", !Ref FrontendOrigins]
      Policies:
        - Statement:
            - Sid: Tables
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan, dynamodb:Query, dynamodb:BatchWriteItem]
              Resource: [!GetAtt ProposalsTable.Arn, !GetAtt ThresholdsTable.Arn, !GetAtt HistoryTable.Arn]
            - Sid: AlertDelivery
              Effect: Allow
              Action: [sns:Publish, sns:Subscribe]
              Resource: !Ref AlertTopic
            # Inference profiles route to models in several regions, so the model ARN cannot be pinned here.
            - Sid: BedrockAgentModel
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref SentinelApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref SentinelApi
            Path: /
            Method: ANY
Outputs:
  ApiUrl:
    Description: Open this URL for the dashboard. The API is under /api.
    Value: !Sub https://${SentinelApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  ProposalsTableName: {Value: !Ref ProposalsTable}
  ThresholdsTableName: {Value: !Ref ThresholdsTable}
  HistoryTableName: {Value: !Ref HistoryTable}
  AlertTopicArn: {Value: !Ref AlertTopic}
